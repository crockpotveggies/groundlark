# Apply only during supervised power-controller bring-up with JP130 removed.
# BCM6 active low requests shutdown; BCM13 asserts only in the kernel poweroff path.
dtoverlay=gpio-shutdown,gpio_pin=6,active_low=1,gpio_pull=off,debounce=100
dtoverlay=gpio-poweroff,gpiopin=13,active_delay_ms=100,inactive_delay_ms=100,timeout_ms=3000
