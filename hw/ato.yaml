requires-atopile: "0.15.9"
paths:
  src: .
  layout: build/layout
builds:
  trenz_hat:
    standardize_designators: false
    keep_net_names: false
    entry: groundlark-fpga-hat/elec/hat_trenz.ato:TrenzHat
    paths:
      layout: groundlark-fpga-hat/layout/trenz_hat/trenz_hat.kicad_pcb
  hat:
    standardize_designators: false
    keep_net_names: false
    entry: groundlark-coldfoot-hat/elec/hat.ato:Hat
    paths:
      layout: groundlark-coldfoot-hat/layout/hat/hat.kicad_pcb
  field_head:
    standardize_designators: false
    keep_net_names: false
    entry: burrowlark-usb/elec/field_head.ato:FieldHead
    paths:
      layout: burrowlark-usb/layout/field_head/field_head.kicad_pcb
